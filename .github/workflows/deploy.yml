name: Deploy Global Fashion
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: global-fashion-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.CLOUDFLARE_D1_DATABASE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: node scripts/test-store.mjs
      - run: node scripts/check-pages.mjs
      - run: npm run build
      - run: node scripts/deploy-cloudflare.mjs
